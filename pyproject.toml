[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretvoice"
version = "0.1.0"
description = "SecretVoice Python SDK — expressive, intimate AI text-to-speech. 29 sensual voices, 21 languages, HTTP streaming and realtime WebSocket."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "codysaudio" }]
keywords = ["tts", "text-to-speech", "voice", "ai", "audio", "whisper", "asmr", "narration", "realtime", "sdk"]
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
]

[project.urls]
Homepage = "https://github.com/saudiodev/secretvoice-sdk"
Repository = "https://github.com/saudiodev/secretvoice-sdk"
Issues = "https://github.com/saudiodev/secretvoice-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]